name: Tests

# Runs the unit test suite (tests/) -- parse_query's date/version/entity
# parsing, chunk.py's entity-tagging and paragraph-packing rules, and
# eval.py's/llm_cache.py's own scoring/caching logic. None of these need
# the network, the embedding model, or a live vector store (see the
# README's Tests section) -- pip installing the full dependency list is
# still required though, since importing src modules like retrieve.py
# pulls in chromadb/sentence-transformers/groq at import time even though
# the tests themselves never call out to any of them.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v
